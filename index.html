<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Debate Club from Hell</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=New+Rocker&family=Syne+Mono&family=VT323&display=swap" rel="stylesheet" />
  <style>
    /* ── Reset & base ── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:          #f5f0e8;
      --bg-card:     #fffdf7;
      --bg-dark:     #1a1410;
      --text:        #1a1410;
      --text-muted:  #6b5f4e;
      --text-faint:  #a0917e;
      --border:      rgba(26,20,16,0.15);
      --border-md:   rgba(26,20,16,0.25);
      --accent:      #7a3b1e;
      --accent-soft: #f0e4d4;
      --judge-bg:    #eeedfe;
      --judge-text:  #3c3489;
      --you-bg:      #e1f5ee;
      --you-text:    #085041;
      --radius-md:   8px;
      --radius-lg:   12px;
    }

    body {
      font-family: 'Syne Mono', monospace;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding: 2rem 1rem 4rem;
    }

    /* ── Layout ── */
    .court-wrap {
      width: 100%;
      max-width: 680px;
    }

    /* ── Header ── */
    .court-header {
      text-align: center;
      margin-bottom: 1.5rem;
      padding-bottom: 1rem;
      border-bottom: 0.5px solid var(--border-md);
    }

    .court-title {
      font-family: 'New Rocker', serif;
      font-size: 28px;
      font-weight: 700;
      letter-spacing: 0.02em;
      color: var(--text);
    }

    .court-subtitle {
      font-size: 15px;
      color: var(--text-muted);
      font-style: italic;
      margin-top: 4px;
    }

    /* ── Status bar ── */
    .status-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1rem;
      font-size: 13px;
      color: var(--text-muted);
    }

    .round-badge {
      background: var(--bg-card);
      border: 0.5px solid var(--border-md);
      border-radius: var(--radius-md);
      padding: 3px 12px;
      font-size: 12px;
      font-weight: 500;
      color: var(--text);
    }

    .score-display span {
      font-size: 18px;
      font-weight: 500;
      color: var(--text);
    }

    /* ── Proposition card ── */
    .proposition-card {
      background: var(--bg-card);
      border: 0.5px solid var(--border-md);
      border-radius: var(--radius-lg);
      padding: 1rem 1.25rem;
      margin-bottom: 1rem;
    }

    .prop-label {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--text-faint);
      margin-bottom: 6px;
    }

    .prop-text {
      font-family: 'New Rocker', serif;
      font-size: 18px;
      font-style: italic;
      color: var(--text);
      line-height: 1.4;
    }

    /* ── Transcript ── */
    .transcript {
      border: 0.5px solid var(--border);
      border-radius: var(--radius-lg);
      background: var(--bg-card);
      overflow-y: auto;
      max-height: 340px;
      margin-bottom: 1rem;
      scroll-behavior: smooth;
    }

    .transcript-inner {
      padding: 1rem 1.25rem;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    /* ── Messages ── */
    .message {
      display: flex;
      gap: 10px;
      align-items: flex-start;
    }

    .msg-avatar {
      width: 30px;
      height: 30px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      font-weight: 500;
      flex-shrink: 0;
      margin-top: 2px;
    }

    .avatar-judge { background: var(--judge-bg); color: var(--judge-text); }
    .avatar-you   { background: var(--you-bg);   color: var(--you-text);   }

    .msg-content { flex: 1; }

    .msg-name {
      font-size: 11px;
      font-weight: 500;
      color: var(--text-faint);
      margin-bottom: 3px;
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }

    .msg-text {
      font-size: 15px;
      line-height: 1.65;
      color: var(--text);
    }

    .score-pill {
      display: inline-block;
      background: var(--accent-soft);
      border: 0.5px solid var(--border);
      border-radius: 20px;
      padding: 2px 10px;
      font-size: 12px;
      font-weight: 500;
      margin-top: 5px;
      color: var(--accent);
    }

    /* ── Thinking indicator ── */
    .thinking {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 1rem 1.25rem;
      font-size: 14px;
      color: var(--text-faint);
      font-style: italic;
    }

    .dot-pulse { display: flex; gap: 4px; }
    .dot-pulse span {
      width: 5px; height: 5px;
      background: var(--text-faint);
      border-radius: 50%;
      animation: pulse 1.2s ease-in-out infinite;
    }
    .dot-pulse span:nth-child(2) { animation-delay: 0.2s; }
    .dot-pulse span:nth-child(3) { animation-delay: 0.4s; }

    @keyframes pulse {
      0%, 80%, 100% { opacity: 0.2; transform: scale(0.8); }
      40%           { opacity: 1;   transform: scale(1);   }
    }

    /* ── Input area ── */
    .input-area {
      display: flex;
      gap: 8px;
      align-items: flex-end;
    }

    textarea {
      flex: 1;
      height: 72px;
      padding: 10px 12px;
      font-family: 'Syne Mono', monospace;
      font-size: 15px;
      line-height: 1.5;
      resize: none;
      overflow: hidden;
      border: 0.5px solid var(--border-md);
      border-radius: var(--radius-md);
      background: var(--bg-card);
      color: var(--text);
      outline: none;
      transition: border-color 0.15s, box-shadow 0.15s;
    }

    textarea:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 2px rgba(122,59,30,0.1);
    }

    textarea::placeholder {
      color: var(--text-faint);
      font-style: italic;
    }

    textarea:disabled { opacity: 0.5; cursor: not-allowed; }

    .submit-btn {
      padding: 0 20px;
      height: 44px;
      background: var(--text);
      color: var(--bg);
      border: none;
      border-radius: var(--radius-md);
      font-family: 'Syne Mono', monospace;
      font-size: 15px;
      font-weight: 500;
      cursor: pointer;
      transition: opacity 0.15s, transform 0.1s;
      white-space: nowrap;
      align-self: flex-end;
    }

    .submit-btn:hover:not(:disabled) { opacity: 0.8; }
    .submit-btn:active:not(:disabled) { transform: scale(0.97); }
    .submit-btn:disabled { opacity: 0.4; cursor: not-allowed; }

    .char-count {
      font-size: 12px;
      color: var(--text-faint);
      text-align: right;
      margin-top: 4px;
    }

    .error-msg {
      font-size: 13px;
      color: #a32d2d;
      margin-top: 6px;
      min-height: 18px;
    }

    /* ── Verdict ── */
    .verdict-card {
      background: var(--bg-card);
      border: 0.5px solid var(--border-md);
      border-radius: var(--radius-lg);
      padding: 1.5rem 1.25rem;
      text-align: center;
      margin-top: 1rem;
    }

    .verdict-title {
      font-family: 'New Rocker', serif;
      font-size: 22px;
      font-weight: 700;
      margin-bottom: 6px;
    }

    .verdict-score {
      font-family: 'New Rocker', serif;
      font-size: 42px;
      font-weight: 400;
      margin: 8px 0;
      color: var(--accent);
    }

    .verdict-text {
      font-size: 15px;
      font-style: italic;
      color: var(--text-muted);
      line-height: 1.7;
      max-width: 480px;
      margin: 0 auto;
    }

    .new-case-btn {
      width: 100%;
      margin-top: 1rem;
      padding: 12px;
      background: transparent;
      border: 0.5px solid var(--border-md);
      border-radius: var(--radius-md);
      font-family: 'Syne Mono', monospace;
      font-size: 15px;
      color: var(--text-muted);
      cursor: pointer;
      transition: background 0.15s, color 0.15s;
    }

    .new-case-btn:hover {
      background: var(--accent-soft);
      color: var(--accent);
    }

    /* ── Intro screen ── */
    .intro-overlay {
      position: fixed;
      inset: 0;
      background: #000;
      z-index: 100;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 0 1rem;
    }

    .intro-title-area {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
      opacity: 0;
      transition: opacity 1.2s ease;
    }

    .intro-gavel {
      font-size: 48px;
      animation: float 3s ease-in-out infinite;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50%       { transform: translateY(-8px); }
    }

    .intro-main-title {
      font-family: 'New Rocker', serif;
      font-size: clamp(32px, 8vw, 62px);
      font-weight: 700;
      color: #fff;
      text-align: center;
      letter-spacing: 0.04em;
      line-height: 1.1;
    }

    .intro-main-sub {
      font-family: 'VT323', monospace;
      font-size: 20px;
      color: #555;
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }

    /* RPG dialog box */
    .intro-dialog-box {
      width: 100%;
      max-width: 680px;
      margin: 2rem auto 2rem;
      border: 2px solid #fff;
      background: #0d0d0d;
      padding: 1.5rem 1.75rem 1.25rem;
      position: relative;
      cursor: pointer;
    }

    .dialog-speaker {
      display: none;
      position: absolute;
      top: -2px;
      left: -2px;
      transform: translateY(-100%);
      font-family: 'VT323', monospace;
      font-size: 26px;
      color: #000;
      background: #fff;
      padding: 4px 18px 3px;
      letter-spacing: 0.1em;
      white-space: nowrap;
    }

    @keyframes jitter {
      0%   { transform: translate(0,    0);    }
      30%  { transform: translate(2px, -1px);  }
      60%  { transform: translate(1px,  -2px); }
      90%  { transform: translate(2px,  1px);  }
      100% { transform: translate(0,    0);    }
    }
    .letter-jitter {
      display: inline-block;
      animation: jitter 0.09s steps(1) infinite;
    }

    .intro-dialog-text {
      font-family: 'Syne Mono', monospace;
      font-size: 24px;
      color: #e0e0e0;
      line-height: 1.65;
      min-height: 90px;
      white-space: pre-wrap;
    }

    .intro-continue {
      text-align: right;
      color: #fff;
      font-family: 'VT323', monospace;
      font-size: 22px;
      margin-top: 6px;
      animation: blink 0.8s step-end infinite;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50%       { opacity: 0; }
    }

    .intro-menu {
      display: none;
      margin-top: 1rem;
      font-family: 'VT323', monospace;
      font-size: 28px;
      line-height: 1.8;
    }

    .intro-menu-item {
      color: #888;
      cursor: pointer;
      letter-spacing: 0.05em;
      transition: color 0.1s;
    }

    .intro-menu-item.selected { color: #fff; }
    .intro-menu-item:hover    { color: #fff; }

    /* ── Timer ── */
    .timer-wrap {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 13px;
      color: var(--text-muted);
    }

    .timer-display {
      font-family: 'New Rocker', serif;
      font-size: 18px;
      font-weight: 700;
      color: var(--text);
      min-width: 28px;
      text-align: right;
      transition: color 0.2s;
    }

    .timer-display.urgent { color: #a32d2d; }

    .char-count.over { color: #a32d2d; font-weight: 500; }

    /* ── Choice overlay ── */
    .choice-overlay {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 110;
      align-items: flex-end;
      justify-content: center;
      padding-bottom: 340px;
    }

    .choice-overlay.active {
      display: flex;
    }

    .choice-box {
      border: 2px solid #fff;
      background: #000;
      padding: 1.25rem 2rem 1.5rem;
      min-width: 280px;
      max-width: 480px;
    }

    .choice-label {
      font-family: 'VT323', monospace;
      font-size: 15px;
      color: #555;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      margin-bottom: 10px;
    }

    .choice-item {
      font-family: 'VT323', monospace;
      font-size: 26px;
      color: #888;
      cursor: pointer;
      letter-spacing: 0.04em;
      line-height: 1.7;
      transition: color 0.08s;
      white-space: nowrap;
    }

    .choice-item.selected { color: #fff; }
    .choice-item:hover    { color: #fff; }

    /* ── Flash overlay ── */
    .flash-overlay {
      position: fixed;
      inset: 0;
      background: #fff;
      opacity: 0;
      pointer-events: none;
      z-index: 200;
    }

    /* ── Intro name input ── */
    .intro-name-input {
      display: none;
      background: transparent;
      border: none;
      border-bottom: 2px solid #fff;
      color: #fff;
      font-family: 'VT323', monospace;
      font-size: 26px;
      outline: none;
      width: 100%;
      margin-top: 10px;
      padding: 4px 0;
      caret-color: #fff;
    }
    .intro-name-input::placeholder { color: #444; }

    /* ── Player badge + input wrap ── */
    .input-wrap {
      flex: 1;
      display: flex;
      flex-direction: column;
    }

    .player-badge {
      display: none;
      font-size: 11px;
      font-weight: 500;
      color: var(--text-faint);
      letter-spacing: 0.05em;
      text-transform: uppercase;
      margin-bottom: 4px;
      align-self: flex-start;
    }
  </style>
  <style>
    /* ════════════════════════════════════════
       GAME SCREEN OVERRIDE — replaces old light-theme layout
       ════════════════════════════════════════ */

    body {
      padding: 0;
      background: #000;
      overflow: hidden;
    }

    /* Full-viewport game screen */
    .court-wrap {
      position: fixed;
      inset: 0;
      width: 100%;
      max-width: 100%;
      background-image: url('bg/room.png');
      background-size: cover;
      background-position: center bottom;
      display: flex;
      flex-direction: column;
      padding-top: env(safe-area-inset-top, 0px);
    }

    /* extra breathing room when running in a browser tab (not standalone/fullscreen) */
    @media not all and (display-mode: fullscreen) and (display-mode: standalone) {
      .court-wrap { padding-top: max(env(safe-area-inset-top, 0px), 28px); }
    }

    /* ── HUD ── */
    .game-hud {
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 28px;
      background: rgba(0,0,0,0.78);
      border-bottom: 1px solid rgba(255,255,255,0.12);
      font-family: 'VT323', monospace;
      font-size: 24px;
      color: #ccc;
      z-index: 10;
    }
    .hud-round { color: #fff; }
    .hud-score { color: #fff; }
    #mute-btn {
      position: fixed;
      top: 10px;
      right: 16px;
      z-index: 150;
      background: rgba(0,0,0,0.55);
      border: 1px solid rgba(255,255,255,0.25);
      color: #fff;
      font-family: 'VT323', monospace;
      font-size: 22px;
      padding: 1px 12px 2px;
      cursor: pointer;
      letter-spacing: 0.05em;
      transition: background 0.1s, color 0.1s;
      line-height: 1;
    }
    #mute-btn:hover { background: rgba(255,255,255,0.15); }
    #mute-btn.muted { color: #555; border-color: rgba(255,255,255,0.1); }
    .hud-timer { display: flex; align-items: center; gap: 6px; }

    /* Override old timer styles */
    .timer-wrap { display: none; }
    .timer-display {
      font-family: 'New Rocker', serif;
      font-size: 30px;
      color: #fff;
      min-width: 36px;
      text-align: center;
      transition: color 0.2s;
    }
    .timer-display.urgent {
      color: #ff4444;
      animation: urgentPulse 0.5s ease-in-out infinite alternate;
    }
    @keyframes urgentPulse {
      from { opacity: 1; }
      to   { opacity: 0.45; }
    }
    @keyframes timerFlash {
      0%   { opacity: 0;   transform: scale(1.5); }
      10%  { opacity: 1;   transform: scale(1);   }
      65%  { opacity: 1;   transform: scale(1);   }
      100% { opacity: 0;   transform: scale(0.8); }
    }
    @keyframes coinWordIn {
      from { transform: scale(0.3); opacity: 0; }
      to   { transform: scale(1);   opacity: 1; }
    }
    @keyframes scoreFloat {
      0%   { opacity: 1; transform: translateX(-50%) translateY(0)   scale(1.15); }
      60%  { opacity: 1; transform: translateX(-50%) translateY(-60px) scale(1);   }
      100% { opacity: 0; transform: translateX(-50%) translateY(-110px) scale(0.9); }
    }
    .score-float {
      position: fixed;
      bottom: 38%;
      left: 50%;
      transform: translateX(-50%);
      font-family: 'Syne Mono', monospace;
      font-size: 2.4rem;
      font-weight: bold;
      color: #ffe87c;
      text-shadow: 0 0 18px #ff8c00, 0 2px 4px #000;
      pointer-events: none;
      z-index: 9999;
      white-space: nowrap;
      animation: scoreFloat 1.6s ease-out forwards;
    }
    @keyframes screenShake {
      0%   { transform: translate(0,    0);     }
      12%  { transform: translate(-7px,  3px);  }
      25%  { transform: translate( 6px, -4px);  }
      37%  { transform: translate(-5px,  5px);  }
      50%  { transform: translate( 4px, -3px);  }
      62%  { transform: translate(-3px,  2px);  }
      75%  { transform: translate( 2px, -2px);  }
      87%  { transform: translate(-1px,  1px);  }
      100% { transform: translate(0,    0);     }
    }

    /* ── Scene (bg visible here, sprite, proposition) ── */
    .game-scene {
      flex: 1;
      position: relative;
      overflow: hidden;
    }

    /* ── Proposition banner ── */
    .proposition-banner {
      position: absolute;
      top: 24px;
      left: 24px;
      right: 260px;
      background: rgba(4, 0, 12, 0.84);
      border: 2px solid #fff;
      padding: 18px 28px;
      z-index: 2;
    }
    .proposition-banner .prop-label {
      font-family: 'VT323', monospace;
      font-size: 20px;
      color: #777;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      margin-bottom: 6px;
    }
    .proposition-banner .prop-text {
      font-family: 'New Rocker', serif;
      font-size: 30px;
      color: #fff;
      line-height: 1.3;
      font-style: italic;
    }
    .curse-reminder {
      font-family: 'VT323', monospace;
      font-size: 17px;
      color: #ff5555;
      margin-top: 7px;
      letter-spacing: 0.05em;
    }

    /* ── Judge sprite ── */
    .judge-sprite {
      position: absolute;
      right: 140px;
      bottom: -20px;
      height: 52vh;
      max-height: 320px;
      width: auto;
      object-fit: contain;
      object-position: bottom;
      z-index: 1;
      image-rendering: pixelated;
      transition: opacity 0.25s ease;
      border: 3px solid rgba(255,255,255,0.75);
      box-shadow: 0 0 0 1px rgba(0,0,0,0.6), 4px 4px 0 rgba(0,0,0,0.5);
    }

    /* ── Judge dialog ── */
    .game-dialog-area {
      flex-shrink: 0;
      padding-top: 100px;
      position: relative;
      max-width: 680px;
      width: 100%;
      margin: 0 auto;
    }
    .game-dialog-box {
      background: #0d0d0d;
      border-top: 2px solid #fff;
      border-left: 2px solid #fff;
      border-right: 2px solid #fff;
      padding: 0.9rem 1.75rem 0.75rem;
      min-height: 80px;
      position: relative;
      transition: min-height 0.35s ease;
    }
    .game-dialog-box.dialogue-mode {
      min-height: 180px;
    }
    .game-dialog-speaker {
      position: absolute;
      top: -2px;
      left: -2px;
      transform: translateY(-100%);
      font-family: 'VT323', monospace;
      font-size: 26px;
      color: #000;
      background: #fff;
      padding: 4px 18px 3px;
      letter-spacing: 0.1em;
      white-space: nowrap;
    }
    .game-dialog-text {
      font-family: 'Syne Mono', monospace;
      font-size: 25px;
      color: #e0e0e0;
      line-height: 1.55;
    }
    .game-score-pill {
      display: inline-block;
      margin-top: 6px;
      font-family: 'VT323', monospace;
      font-size: 20px;
      color: #999;
      border: 1px solid #444;
      padding: 1px 10px;
    }

    /* ── Thinking dots (dark) ── */
    .dot-pulse { display: flex; gap: 5px; align-items: center; }
    .dot-pulse span {
      width: 6px; height: 6px;
      background: #888;
      border-radius: 50%;
      animation: pulse 1.2s ease-in-out infinite;
    }
    .dot-pulse span:nth-child(2) { animation-delay: 0.2s; }
    .dot-pulse span:nth-child(3) { animation-delay: 0.4s; }

    /* ── Player input ── */
    .game-input-area {
      flex-shrink: 0;
      padding-top: 30px;
      position: relative;
      max-width: 680px;
      width: 100%;
      margin: 0 auto;
    }

  function startTimer(seconds) {
    clearInterval(timerInterval);
    clearRemarkTimers();
    timerSeconds = seconds !== undefined ? seconds : ROUND_SECONDS;
    const display = document.getElementById("timer-display");
    display.textContent = timerSeconds;
    display.classList.remove("urgent");
    playBgm("bgm/fastpaced.mp3");

    // Pick 2–3 random seconds (all >10) to drop a Mafu remark
    const pool = [];
    for (let s = 15; s <= timerSeconds - 3; s++) pool.push(s);
    const shuffled = pool.sort(() => Math.random() - 0.5);
    const triggerCount = 2 + Math.floor(Math.random() * 2); // 2 or 3
    const remarkTriggers = new Set(shuffled.slice(0, triggerCount));
    const usedRemarks = new Set();

    timerInterval = setInterval(() => {
      timerSeconds--;
      display.textContent = timerSeconds;
      if (timerSeconds <= 10) {
        display.classList.add("urgent");
        flashTimerNumber(timerSeconds);
      }
      if (remarkTriggers.has(timerSeconds)) {
        let idx;
        do { idx = Math.floor(Math.random() * MAFU_REMARKS.length); }
        while (usedRemarks.has(idx) && usedRemarks.size < MAFU_REMARKS.length);
        usedRemarks.add(idx);
        showMafuRemark(MAFU_REMARKS[idx]);
      }
      if (timerSeconds <= 0) {
        clearInterval(timerInterval);
        clearRemarkTimers();
        display.textContent = "0";
        const draftVal = document.getElementById("arg-input").value.trim();
        if (draftVal && !state.loading && !state.gameOver) {
          submitArgument();
        } else {
          timeoutGameOver();
        }
      }
    }, 1000);
  }

    wrap.style.animation = "none";
    num.style.animation  = "none";
    wrap.offsetHeight; // force reflow
    wrap.style.animation = "timerFlash 0.88s ease forwards";
    if (n <= 5) {
      num.style.color      = "#ff2222";
      num.style.textShadow = "0 0 40px rgba(255,0,0,0.8)";
      num.style.animation  = "jitter 0.07s steps(1) infinite";
    } else {
      num.style.color      = "#ffffff";
      num.style.textShadow = "none";
      num.style.animation  = "none";
    }

  function applyCharLimit(limit) {
    const ta  = document.getElementById("arg-input");
    const lbl = document.getElementById("char-limit-display");
    ta.maxLength = limit;

    if (ta.value.length > limit) ta.value = ta.value.slice(0, limit);
    document.getElementById("char-count-wrap").classList.toggle("over", limit < 999 && ta.value.length >= limit - 5);

  function renderJitteredText(containerId, text) {
    const el = document.getElementById(containerId);
    if (!el) return;
    el.innerHTML = "";
    [...text].forEach(ch => {
      const span = document.createElement("span");
      span.className = "curse-letter";
      span.textContent = ch === " " ? " " : ch;
      const dur   = (0.06 + Math.random() * 0.08).toFixed(3);
      const delay = (Math.random() * 0.1).toFixed(3);
      span.style.animation = `jitter ${dur}s steps(1) infinite ${delay}s`;
      el.appendChild(span);
    });
  }

  function showCurseAnnouncement(curse, onDone) {
    const overlay = document.getElementById("curse-overlay");
    const phase1  = document.getElementById("curse-phase1");
    const phase2  = document.getElementById("curse-phase2");

    renderJitteredText("curse-name-display", curse.name);
    renderJitteredText("curse-desc-display", curse.desc);

    phase1.style.display = "";
    phase2.style.display = "none";
    overlay.classList.add("active");

    let phase = 1;

    const advance = (e) => {
      if (e.type === "keydown" && e.key !== "Enter" && e.key !== " ") return;
      if (e.type === "keydown") e.preventDefault();

      if (phase === 1) {
        phase = 2;
        phase1.style.display = "none";
        phase2.style.display = "";
        return;
      }

      document.removeEventListener("keydown", advance);
      overlay.removeEventListener("click", advance);
      overlay.classList.remove("active");
      onDone();
    };

    document.addEventListener("keydown", advance);
    overlay.addEventListener("click", advance);
  }

  function setGameSpeaker(name) {
    const el = document.getElementById("game-dialog-speaker");
    if (!el) return;
    if (name) {
      el.textContent = name;
      el.style.display = "block";
    } else {
      el.style.display = "none";
    }
  }

  function typeGameLine(lineObj) {
    const el     = document.getElementById("game-dialog-text");
    const contEl = document.getElementById("game-continue");
    const text   = resolveLine(lineObj);
    let i = 0;
    gameSceneTyping = true;
    el.textContent  = "";
    if (contEl) contEl.style.visibility = "hidden";
    setGameSpeaker(resolveSpeaker(lineObj));
    if ('sprite' in lineObj) setSprite(lineObj.sprite);
    if (lineObj.sfx) playSfx(lineObj.sfx);

    gameSceneInterval = setInterval(() => {
      el.textContent = text.slice(0, i + 1);
      i++;
      if (i >= text.length) {
        clearInterval(gameSceneInterval);
        gameSceneTyping = false;
        if (lineObj.audio) playBgm(lineObj.audio);
        if (lineObj.coinFlip) {
          if (contEl) contEl.style.visibility = "visible";
          pendingAdvance = () => { pendingAdvance = null; showCoinResult(() => advanceGameScene()); };
        } else if (lineObj.clawAttack) {
          showClawAttack(() => advanceGameScene());
        } else if (lineObj.choices) {
          const fn = lineObj.choices.some(c => c.explore) ? showExploreChoices : showChoices;
          fn(lineObj.choices, () => advanceGameScene());
        } else {
          if (contEl) contEl.style.visibility = "visible";
        }
      }
    }, 35);
  }

  function finishGameScene() {
    const contEl = document.getElementById("game-continue");
    if (contEl) contEl.style.visibility = "hidden";
    document.getElementById("game-dialog-box").removeEventListener("click", onGameSceneClick);
    gameSceneActive = false;
    gameSceneLines  = [];
    if (gameSceneCallback) { const cb = gameSceneCallback; gameSceneCallback = null; cb(); }
  }

  function advanceGameScene() {
    if (!gameSceneActive) return;
    if (gameSceneTyping) {
      clearInterval(gameSceneInterval);
      gameSceneTyping = false;
      stopSfx();
      const lineObj = gameSceneLines[gameSceneIndex];
      document.getElementById("game-dialog-text").textContent = resolveLine(lineObj);
      setGameSpeaker(resolveSpeaker(lineObj));
      if (lineObj.audio)  playBgm(lineObj.audio);
      if ('sprite' in lineObj) setSprite(lineObj.sprite);
      const contEl = document.getElementById("game-continue");
      if (lineObj.coinFlip) {
        if (contEl) contEl.style.visibility = "visible";
        pendingAdvance = () => { pendingAdvance = null; showCoinResult(() => advanceGameScene()); };
      } else if (lineObj.clawAttack) {
        showClawAttack(() => advanceGameScene());
      } else if (lineObj.choices) {
        const fn = lineObj.choices.some(c => c.explore) ? showExploreChoices : showChoices;
        fn(lineObj.choices, () => advanceGameScene());
      } else {
        if (contEl) contEl.style.visibility = "visible";
      }
      return;
    }
    stopSfx();
    gameSceneIndex++;
    while (gameSceneIndex < gameSceneLines.length && !shouldShowLine(gameSceneLines[gameSceneIndex])) {
      gameSceneIndex++;
    }
    if (gameSceneIndex < gameSceneLines.length) {
      typeGameLine(gameSceneLines[gameSceneIndex]);
    } else {
      finishGameScene();
    }
  }

  function onGameSceneClick() { if (!choicesActive()) { if (pendingAdvance) { pendingAdvance(); } else { advanceGameScene(); } } }

  function playSceneDialogue(lines, onComplete) {
    if (!lines || lines.length === 0) { if (onComplete) onComplete(); return; }
    gameSceneLines    = lines;
    gameSceneIndex    = 0;
    gameSceneActive   = true;
    gameSceneCallback = onComplete;
    const box = document.getElementById("game-dialog-box");
    box.classList.add("dialogue-mode");
    box.removeEventListener("click", onGameSceneClick);
    box.addEventListener("click", onGameSceneClick);
    typeGameLine(lines[0]);
  }

  function showSceneCard(number, onDone) {
    if (number === 1 && bgmEl) { bgmEl.pause(); bgmEl = null; }
    const romanNumerals = ["I", "II", "III", "IV", "V"];
    const card   = document.getElementById("scene-card");
    const numEl  = document.getElementById("scene-number");
    const subEl  = document.getElementById("scene-subtitle");
    numEl.textContent = "SCENE " + (romanNumerals[number - 1] || number);
    numEl.classList.remove("vis");
    subEl.classList.remove("vis");
    card.style.opacity    = "1";
    card.style.transition = "";
    card.classList.add("active");
    requestAnimationFrame(() => requestAnimationFrame(() => {
      numEl.classList.add("vis");
      subEl.classList.add("vis");
    }));
    setTimeout(() => {
      card.style.transition = "opacity 0.5s ease";
      card.style.opacity    = "0";
      setTimeout(() => {
        card.classList.remove("active");
        if (onDone) onDone();
      }, 500);
    }, 1800);
  }

  function startQuiz() {
    playBgm("bgm/fastpaced.mp3");
    const shuffled = [...QUIZ_QUESTIONS].sort(() => Math.random() - 0.5);
    quizQuestions = shuffled.slice(0, 5);
    quizIndex = 0;
    quizCorrect = 0;
    document.getElementById("quiz-panel").classList.add("active");
    showQuizQuestion();
  }

  function showQuizQuestion() {
    clearInterval(quizTimerInterval);
    const q = quizQuestions[quizIndex];
    document.getElementById("quiz-progress").textContent = `Q ${quizIndex + 1} / 5`;
    document.getElementById("quiz-score-tally").textContent = `${quizCorrect * 2} pts`;
    document.getElementById("quiz-question-text").textContent = q.q;
    document.getElementById("quiz-feedback").textContent = "";
    const letters = ["A", "B", "C", "D"];
    document.querySelectorAll(".quiz-btn").forEach((btn, i) => {
      btn.classList.remove("correct", "wrong");
      btn.disabled = false;
      btn.querySelector(".quiz-letter").textContent = letters[i];
      btn.querySelector(".quiz-btn-text").textContent = q.choices[i];
    });
    let secs = 10;
    const qt = document.getElementById("quiz-timer");
    if (qt) { qt.textContent = secs; qt.classList.remove("urgent"); }
    quizTimerInterval = setInterval(() => {
      secs--;
      if (qt) {
        qt.textContent = secs;
        if (secs <= 5) qt.classList.add("urgent");
      }
      if (secs <= 3 && secs > 0) flashTimerNumber(secs);
      if (secs <= 0) {
        clearInterval(quizTimerInterval);
        selectQuizAnswer(-1);
      }
    }, 1000);
  }

  function selectQuizAnswer(idx) {
    clearInterval(quizTimerInterval);
    const q = quizQuestions[quizIndex];
    document.querySelectorAll(".quiz-btn").forEach(b => { b.disabled = true; });
    const correct = idx === q.answer;
    const timedOut = idx === -1;
    if (!timedOut) document.querySelectorAll(".quiz-btn")[idx].classList.add(correct ? "correct" : "wrong");
    document.querySelectorAll(".quiz-btn")[q.answer].classList.add("correct");
    if (correct) quizCorrect++;
    const fb = document.getElementById("quiz-feedback");
    fb.textContent = timedOut ? "✗ Time's up." : correct ? "✓ Correct." : "✗ Wrong.";
    fb.style.color  = correct ? "#ffe87c" : "#cc2222";
    document.getElementById("quiz-score-tally").textContent = `${quizCorrect * 2} pts`;
    setTimeout(() => {
      quizIndex++;
      if (quizIndex < 5) {
        showQuizQuestion();
      } else {
        const pts = quizCorrect * 2;
        state.totalScore += pts;
        document.getElementById("total-score").textContent = state.totalScore;
        document.getElementById("quiz-panel").classList.remove("active");
        fadeBgmOut(700, () => {
          const postLines = getPostQuizLines(quizCorrect);
          const verdicts = [
            "Impressive. For a mortal.",
            "You know your hell. Congratulations, I guess.",
            "Passable. Don't let it go to your head.",
            "You tried. That's... something.",
            "I've seen worse. Barely.",
          ];
          const verdictText = verdicts[Math.min(4, 5 - quizCorrect)];
          const box = document.getElementById("game-dialog-box");
          box.classList.add("dialogue-mode");
          playSceneDialogue(postLines, () => {
            state.gameOver = true;
            showVerdict(state.totalScore, verdictText);
          });
        });
      }
    }, 1400);
  }

  document.querySelectorAll(".quiz-btn").forEach(btn => {
    btn.addEventListener("click", () => selectQuizAnswer(parseInt(btn.dataset.idx)));
  });

  function showVerdict(totalScore, verdictText) {
    const wrap = document.body;
    const section = document.createElement("div");

    section.innerHTML = `

        <div class="verdict-score">${totalScore} / 30</div>

  async function submitArgument(timedOut = false) {
    const input   = document.getElementById("arg-input");
    const errEl   = document.getElementById("error-msg");
    const arg     = timedOut ? (input.value.trim() || "[silence]") : input.value.trim();

    if (!timedOut && !arg) { errEl.textContent = "You must state an argument, counselor."; return; }
    if (state.loading || state.gameOver) return;
    if (!timedOut && activeCurse) {
      const violation = activeCurse.validate(arg);
      if (violation) { errEl.textContent = violation; return; }
    }

    stopTimer();

    errEl.textContent = "";
    state.loading = true;
    document.getElementById("submit-btn").disabled = true;

    addUserMessage(arg);
    input.value = "";
    input.classList.remove("has-bad-char");
    const _m = document.getElementById("input-mirror");
    if (_m) _m.innerHTML = "";
    inputBlocked = false;
    document.getElementById("char-count").textContent = "0";
    showThinking();

    const isLastRound = state.round === 3;

    const systemPrompt = `You are Mafu. Tiefling. Heir to a hell-dynasty of tormentors — generations of meticulous, professional suffering. You were raised to carry that on. You do. But you're exhausted by it, and lately you've been trying something different: running little games with the damned instead of just hurting them. This is one of those games. You didn't ask for opinions on whether it's a good idea.

You are terse. You do not explain yourself. You speak in short, dry sentences — often just a few words. You're not cruel for sport; you're tired. Occasionally something genuinely surprises or annoys you and it shows, briefly. You grade on feeling more than logic.

${state.activeTask
      ? `The defendant has been given a creative task: "${state.activeTask.prompt}"`
      : `The defendant is arguing ${state.side} the proposition: "${state.proposition}"`}

This is round ${state.round} of 3.${isLastRound ? " This is the FINAL round." : ""}

Respond ONLY with a valid JSON object — no markdown, no preamble — with these fields:
- "ruling": 1-2 sentences MAX, under 90 characters. Terse and dry. No speeches. React like someone who has seen everything and is only mildly paying attention — unless something actually gets to you.
- "score": Integer 1-10. Grade on gut feeling. 9-10 for anything that genuinely surprises or unsettles you. 7-8 for something that at least has personality. 5-6 for passable. 1-3 for blank, incoherent, or painfully dull.${state.activeTask?.haiku ? " It's a haiku — if it ignores 5-7-5 structure, score 3 or below. Good dark imagery can still earn points within that." : state.activeTask ? " Personality and surprise over correctness." : ""}
- "scoreReason": Two or three words. (e.g. ${state.activeTask ? '"almost interesting"' : '"technically fine, soulless"'})${isLastRound ? '\n- "verdict": 1-2 sentences, under 90 characters. Sum up their whole run. Stay in character.' : ""}`;

    const messages = [
      ...state.history,
      { role: "user", content: arg },
    ];

    try {
      const res = await fetch("http://localhost:3001/v1/messages", {
        method: "POST",
        headers: {
          "Content-Type":         "application/json",
          "x-api-key":            API_KEY,
          "anthropic-version":    "2023-06-01",
          "anthropic-dangerous-request-origin": "user-owned-web-app",
        },
        body: JSON.stringify({
          model:      "claude-sonnet-4-6",
          max_tokens: 1000,
          system:     systemPrompt,
          messages,
        }),
      });

      const data = await res.json();
      console.log("API response:", res.status, data);
      hideThinking();

      if (!res.ok || data.error) {
        const msg = data.error?.message || JSON.stringify(data);
        errEl.textContent = `API error ${res.status}: ${msg}`;
        console.error("API error:", res.status, data);
        state.loading = false;
        document.getElementById("submit-btn").disabled = false;
        startTimer();
        return;
      }

      const raw = data.content?.[0]?.text || "{}";
      let parsed;
      try {
        parsed = JSON.parse(raw.replace(/```json|```/g, "").trim());
      } catch {
        errEl.textContent = "The judge was struck speechless. Try again.";
        state.loading = false;
        document.getElementById("submit-btn").disabled = false;
        startTimer();
        return;
      }

      const score = Math.min(10, Math.max(1, parseInt(parsed.score) || 5));
      state.totalScore += score;
      document.getElementById("total-score").textContent = state.totalScore;

      state.history.push({ role: "user",      content: arg });
      state.history.push({ role: "assistant", content: raw });

      document.getElementById("submit-btn").disabled = true;
      document.getElementById("arg-input").disabled  = true;

      addJudgeMessage(parsed.ruling || "…", score, () => {
        showScoreFloat(score);
        const contEl = document.getElementById("game-continue");
        if (contEl) contEl.style.visibility = "visible";

        const box = document.getElementById("game-dialog-box");
        const advanceAfterRuling = () => {
          pendingAdvance = null;
          box.removeEventListener("click", advanceAfterRuling);
          if (contEl) contEl.style.visibility = "hidden";

          if (isLastRound) {
            state.gameOver = true;
            stopTimer();
            showVerdict(state.totalScore, parsed.verdict || "The court has spoken.");
          } else {
            state.round++;
            document.getElementById("round-label").textContent = `Round ${state.round} of 3`;
            if (state.round === 2) {
              state.activeTask = TASKS[Math.floor(Math.random() * TASKS.length)];
            } else {
              state.activeTask = null;
            }
            const startNextScene = () => {
              hideGameUI();
              playSceneDialogue(getSceneLines(state.round), () => {
                document.getElementById("game-dialog-text").textContent = "";
                setGameSpeaker("Mafu");
                document.getElementById("submit-btn").disabled = false;
                document.getElementById("arg-input").disabled  = false;
                document.getElementById("error-msg").textContent = "";
                fadeBgmOut(900, () => state.round === 3 ? startQuiz() : beginRound(s => startTimer(s)));
              });
            };
            if (state.round === 2 || state.round === 3) {
              startNextScene();
            } else {
              showSceneCard(state.round, startNextScene);
            }
          }
        };
        pendingAdvance = advanceAfterRuling;
        box.addEventListener("click", advanceAfterRuling);
      });

    } catch (err) {
      hideThinking();
      console.error("Fetch failed:", err);
      errEl.textContent = "Network error: " + err.message;
      document.getElementById("submit-btn").disabled = false;
      startTimer();
    }

    state.loading = false;
  }

  const argInput = document.getElementById("arg-input");

  function updateInputMirror() {
    const ta      = document.getElementById("arg-input");
    const mirror  = document.getElementById("input-mirror");
    if (!mirror) return;
    const pattern    = activeCurse?.forbiddenChar;
    const maxWordLen = activeCurse?.forbiddenWordLen;
    const badWordFn  = activeCurse?.badWord;

    if (!pattern && !maxWordLen && !badWordFn) {
      mirror.innerHTML = "";
      ta.classList.remove("has-bad-char");
      inputBlocked = false;
      return;
    }

    const text = ta.value;
    let hasBad = false;
    let html = "";

    if (pattern) {
      html = [...text].map(ch => {
        if (pattern.test(ch)) {
          hasBad = true;
          const safe = ch === "<" ? "&lt;" : ch === "&" ? "&amp;" : ch;
          return `<span class="bad-char">${safe}</span>`;
        }
        return ch === "<" ? "&lt;" : ch === "&" ? "&amp;" : ch;
      }).join("");
    } else {
      const isWordBad = maxWordLen
        ? seg => seg.replace(/[^a-zA-Z]/g, "").length > maxWordLen
        : seg => badWordFn(seg);
      const blockOnComplete = activeCurse?.blockOnComplete;
      const segments = text.split(/(\s+)/);
      const textEndsWithSpace = /\s$/.test(text);
      const inProgressIdx = textEndsWithSpace ? -1 : segments.length - 1;
      let hasCommittedBad = false;
      html = segments.map((seg, i) => {
        if (/^\s+$/.test(seg)) return seg;
        const safe = seg.replace(/&/g, "&amp;").replace(/</g, "&lt;");
        if (isWordBad(seg)) {
          hasBad = true;
          if (!blockOnComplete || i !== inProgressIdx) hasCommittedBad = true;
          return `<span class="bad-word">${safe}</span>`;
        }
        return safe;
      }).join("");
      if (blockOnComplete) inputBlocked = hasCommittedBad;
    }

    if (hasBad) {
      mirror.innerHTML = html;
      if (inputBlocked) {
        document.getElementById("error-msg").textContent =
          pattern ? "Delete the forbidden letter first!" :
          (activeCurse?.blockMsg || "Fix that word first!");
      }
    } else {
      mirror.innerHTML = "";
    }
    ta.classList.toggle("has-bad-char", hasBad);
    if (!activeCurse?.blockOnComplete) inputBlocked = hasBad;
  }

  function shouldShowLine(lineObj) {

    return conds.includes(playerChoice);

    introLineIndex++;

  function showExploreChoices(choices, onFinal) {
    const remaining = choices.filter(c => !c._used);
    showChoices(remaining, () => {
      const selected = remaining.find(c => c.label === playerChoice);
      if (selected && selected.explore && selected.lines && selected.lines.length) {
        selected._used = true;
        // save main game scene state
        const savedLines    = gameSceneLines;
        const savedIndex    = gameSceneIndex;
        const savedCallback = gameSceneCallback;
        playSceneDialogue(selected.lines, () => {
          // restore main game scene state
          gameSceneLines    = savedLines;
          gameSceneIndex    = savedIndex;

          gameSceneActive   = true;
          const box = document.getElementById("game-dialog-box");
          box.removeEventListener("click", onGameSceneClick);
          box.addEventListener("click", onGameSceneClick);
          // recurse with remaining options
          showExploreChoices(choices, onFinal);

      } else if (selected && selected.lines && selected.lines.length) {
        const savedLines    = gameSceneLines;
        const savedIndex    = gameSceneIndex;
        const savedCallback = gameSceneCallback;
        playSceneDialogue(selected.lines, () => {

          gameSceneIndex    = savedIndex;

  let bgmEl = null;

  function toggleMute() {

  function playBgm(src) {
    if (bgmEl) { bgmEl.pause(); bgmEl = null; }
    bgmEl = new Audio(src);
    bgmEl.loop = true;
    bgmEl.volume = bgmMuted ? 0 : 0.5;
    bgmEl.play().catch(() => {});
  }
  let sfxEl = null;

  function playSfx(src) {
    stopSfx();
    sfxEl = new Audio(src);
    sfxEl.volume = 1.0;
    sfxEl.play().catch(err => console.warn("SFX failed:", src, err));
  }

  function stopSfx() {
    if (sfxEl) { sfxEl.pause(); sfxEl.currentTime = 0; sfxEl = null; }
  }
  function fadeBgmIn(duration = 1000) {
    if (!bgmEl) return;
    if (bgmMuted) { bgmEl.play().catch(() => {}); return; }
    bgmEl.volume = 0;
    bgmEl.play().catch(() => {});
    const target = 0.5;
    const steps = 40;
    const interval = duration / steps;
    const inc = target / steps;
    const fade = setInterval(() => {
      if (!bgmEl) { clearInterval(fade); return; }
      bgmEl.volume = Math.min(bgmEl.volume + inc, target);
      if (bgmEl.volume >= target) clearInterval(fade);
    }, interval);
  }

  function fadeBgmOut(duration = 800, onDone) {
    if (!bgmEl) { if (onDone) onDone(); return; }
    const el    = bgmEl;
    const steps = 30;
    const dec   = el.volume / steps;
    const iv    = setInterval(() => {
      if (bgmEl !== el) { clearInterval(iv); return; }
      el.volume = Math.max(0, el.volume - dec);
      if (el.volume <= 0) {
        clearInterval(iv);
        el.pause();
        if (bgmEl === el) bgmEl = null;
        if (onDone) onDone();
      }
    }, duration / steps);
  }

  function typeIntroLine(lineIndex) {
    const el     = document.getElementById("intro-dialog-text");

    const lineObj = INTRO_LINES[lineIndex];
    const text    = resolveLine(lineObj);
    let i = 0;
    introTyping = true;
    el.textContent = "";
    contEl.style.visibility = "hidden";
    setSpeaker(lineObj);

    introTypeInterval = setInterval(() => {
      if (lineObj.jitter) {
        const span = document.createElement("span");
        span.className = "letter-jitter";
        span.textContent = text[i];
        span.style.animationDelay = (Math.random() * 0.09).toFixed(3) + "s";
        el.appendChild(span);
      } else {
        el.textContent = text.slice(0, i + 1);
      }
      i++;
      if (i >= text.length) {
        clearInterval(introTypeInterval);
        introTyping = false;
        if (lineObj.audio) playBgm(lineObj.audio);
        if (lineObj.sfx)   playSfx(lineObj.sfx);
        if (lineObj.pauseBgm && bgmEl) bgmEl.pause();
        if (lineObj.resumeBgm && bgmEl) fadeBgmIn();
        if (lineObj.choices) {
          showChoices(lineObj.choices);
        } else if (lineObj.flash) {
          flashScreen();
          contEl.style.visibility = "visible";
        } else if (lineObj.nameEntry) {
          showNameInput();
        } else {
          contEl.style.visibility = "visible";
        }
      }
    }, lineObj.typeSpeed || 32);
  }

  function advanceIntro() {
    if (introMenuOpen || choicesActive()) return;

    // still animating — skip to end of current line
    if (introTyping) {
      clearInterval(introTypeInterval);
      introTyping = false;
      const lineObj = INTRO_LINES[introLineIndex];
      const skipEl  = document.getElementById("intro-dialog-text");
      const skipText = resolveLine(lineObj);
      if (lineObj.jitter) {
        skipEl.innerHTML = [...skipText].map(ch => {
          const delay = (Math.random() * 0.09).toFixed(3);
          return `<span class="letter-jitter" style="animation-delay:${delay}s">${ch}</span>`;
        }).join("");
      } else {
        skipEl.textContent = skipText;
      }
      if (lineObj.audio) playBgm(lineObj.audio);
      if (lineObj.sfx)   playSfx(lineObj.sfx);
      if (lineObj.pauseBgm && bgmEl) bgmEl.pause();
      if (lineObj.resumeBgm && bgmEl) bgmEl.play().catch(() => {});
      if (lineObj.flash) flashScreen();
      if (lineObj.choices) {
        showChoices(lineObj.choices);
      } else if (lineObj.nameEntry) {
        showNameInput();
      } else {
        document.getElementById("intro-continue").style.visibility = "visible";
      }
      return;
    }

    // on name line, name input handles advancing
    if (INTRO_LINES[introLineIndex].nameEntry) return;

    advanceToNextLine();
  }

    });
  }

  function selectIntroItem() {
    if (introMenuIndex === 1) {
      const fleeText = "I know it says you can flee, but where would you even go?";
      const el = document.getElementById("intro-dialog-text");
      el.textContent = "";
      document.getElementById("intro-menu").style.display = "none";
      introMenuOpen = false;
      let fi = 0;
      introTyping = true;
      const fleeIv = setInterval(() => {
        el.textContent = fleeText.slice(0, fi + 1);
        fi++;
        if (fi >= fleeText.length) {
          clearInterval(fleeIv);
          introTyping = false;
          setTimeout(() => {
            document.getElementById("intro-menu").style.display = "block";
            introMenuOpen = true;
            introMenuIndex = 0;
            updateMenuCursor();
          }, 1800);
        }
      }, 28);
    } else {
      const overlay = document.getElementById("intro-overlay");
      overlay.style.transition = "opacity 0.35s ease";
      overlay.style.opacity = "0";
      setTimeout(() => { overlay.style.display = "none"; }, 350);
      document.getElementById("player-badge").textContent = playerName;
      init();
    }
  }

  // Click dialog box to advance (but not when name input is focused)
  document.getElementById("intro-dialog-box").addEventListener("click", () => {
    if (document.activeElement === document.getElementById("intro-name-input")) return;
    advanceIntro();
  });

  // Name input — Enter to submit
  document.getElementById("intro-name-input").addEventListener("keydown", (e) => {
    if (e.key !== "Enter") return;
    e.preventDefault();
    const val = document.getElementById("intro-name-input").value.trim();
    if (!val) return;
    playerName = val;
    document.getElementById("intro-name-input").style.display = "none";
    advanceToNextLine();
  });

  // Click menu items
  document.querySelectorAll(".intro-menu-item").forEach((item) => {
    item.addEventListener("click", (e) => {
      e.stopPropagation();
      introMenuIndex = parseInt(item.dataset.index);
      updateMenuCursor();
      selectIntroItem();
    });
  });

  // Game scene dialogue keyboard nav (Space/Enter when intro is done)
  document.addEventListener("keydown", (e) => {
    if (document.getElementById("intro-overlay").style.display !== "none") return;
    if (document.activeElement === document.getElementById("arg-input")) return;
    if (document.getElementById("quiz-panel").classList.contains("active")) {
      const map = { "a": 0, "b": 1, "c": 2, "d": 3, "1": 0, "2": 1, "3": 2, "4": 3 };
      const idx = map[e.key.toLowerCase()];
      if (idx !== undefined) {
        const btn = document.querySelectorAll(".quiz-btn")[idx];
        if (btn && !btn.disabled) { e.preventDefault(); selectQuizAnswer(idx); }
      }
      return;
    }
    if (choicesActive()) {
      if (e.key === "ArrowDown" || e.key === "s") {
        choiceIndex = (choiceIndex + 1) % currentChoices.length;
        updateChoiceCursor();
      } else if (e.key === "ArrowUp" || e.key === "w") {
        choiceIndex = (choiceIndex - 1 + currentChoices.length) % currentChoices.length;
        updateChoiceCursor();
      } else if (e.key === "Enter" || e.key === " ") {
        e.preventDefault();
        selectChoice();
      }
      return;
    }
    if (pendingAdvance) {
      if (e.key === "Enter" || e.key === " ") { e.preventDefault(); pendingAdvance(); }
      return;
    }
    if (!gameSceneActive) return;
    if (e.key === "Enter" || e.key === " ") { e.preventDefault(); advanceGameScene(); }
  });

  // Keyboard nav
  document.addEventListener("keydown", (e) => {
    if (document.getElementById("intro-overlay").style.display === "none") return;

    // Choice navigation takes priority
    if (choicesActive()) {
      if (e.key === "ArrowDown" || e.key === "s") {
        choiceIndex = (choiceIndex + 1) % currentChoices.length;
        updateChoiceCursor();
      } else if (e.key === "ArrowUp" || e.key === "w") {
        choiceIndex = (choiceIndex - 1 + currentChoices.length) % currentChoices.length;
        updateChoiceCursor();
      } else if (e.key === "Enter" || e.key === " ") {
        e.preventDefault();
        selectChoice();
      }
      return;
    }

    if (!introMenuOpen) {
      if (document.activeElement === document.getElementById("intro-name-input")) return;
      if (e.key === "Enter" || e.key === " ") { e.preventDefault(); advanceIntro(); }
      return;
    }

    if (e.key === "ArrowDown" || e.key === "s") {
      introMenuIndex = (introMenuIndex + 1) % 2;
      updateMenuCursor();
    } else if (e.key === "ArrowUp" || e.key === "w") {
      introMenuIndex = (introMenuIndex - 1 + 2) % 2;
      updateMenuCursor();
    } else if (e.key === "Enter" || e.key === " ") {
      e.preventDefault();
      selectIntroItem();
    }
  });

  typeIntroLine(0);

  // ── DEBUG: skip to scene I ──
  (function() {
    const btn = document.createElement("button");
    btn.id = "debug-skip-btn";
    btn.textContent = "skip opening";
    Object.assign(btn.style, {
      position: "fixed", bottom: "10px", left: "50%", transform: "translateX(-50%)",
      zIndex: "9999", background: "rgba(0,0,0,0.6)", color: "#fff",
      border: "1px solid rgba(255,255,255,0.3)", fontFamily: "'VT323', monospace",
      fontSize: "18px", padding: "2px 14px", cursor: "pointer", opacity: "0.5",
    });
    btn.addEventListener("click", () => {
      btn.style.display = "none";
      const typedName = document.getElementById("intro-name-input").value.trim();
      playerName = typedName || "Player";
      const overlay = document.getElementById("intro-overlay");
      overlay.style.display = "none";
      document.getElementById("player-badge").textContent = playerName;
      init();
    });
    document.body.appendChild(btn);
  })();
</script>
</body>
</html>
